<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bike & mechanism test stand</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #15232b;
        color: #fff;
        font: 14px system-ui;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      header {
        position: fixed;
        top: 18px;
        left: 20px;
        right: 20px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      select,
      button {
        font: inherit;
        background: #20323e;
        color: #f5e9d4;
        border: 1px solid #647784;
        padding: 10px;
        border-radius: 6px;
      }
      select:focus-visible,
      button:focus-visible {
        outline: 3px solid #ecc68a;
      }
      #objective {
        font-weight: 650;
      }
      #gauges {
        position: fixed;
        bottom: 24px;
        left: 24px;
        line-height: 1.8;
        background: #10202bd9;
        padding: 12px 18px;
        border-radius: 8px;
      }
      #prompt {
        position: fixed;
        bottom: 24px;
        left: 35%;
        right: 24px;
        text-align: center;
        background: #10202bd9;
        padding: 12px 18px;
        border-radius: 8px;
      }
      #toast {
        position: fixed;
        top: 86px;
        left: 20px;
        right: 20px;
        text-align: center;
        font-size: 16px;
        text-shadow: 0 2px 4px #000;
      }
      @media (max-width: 700px) {
        header {
          font-size: 12px;
        }
        #gauges {
          bottom: 90px;
          left: 12px;
          padding: 8px;
        }
        #prompt {
          left: 12px;
          right: 12px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <canvas
      aria-label="Procedural bicycle and mechanism demonstration"
    ></canvas>
    <header>
      <select id="mode" aria-label="Test mode">
        <option value="ride">Ride · flat World</option>
        <option value="bike">Bike repair bench</option>
        <option value="engine">Keystone engine bench</option></select
      ><button id="ridge">Trigger ridge trial</button
      ><span id="objective"></span>
    </header>
    <div id="toast" role="status"></div>
    <div id="gauges"></div>
    <div id="prompt"></div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
