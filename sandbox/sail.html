<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mansi · Ocean sandbox</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #eaf2ee; background: #102b3b; font: 16px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 70vh; min-height: 320px; }
    main { max-width: 1000px; margin: auto; padding: 20px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
    label { display: grid; gap: 8px; }
    input { width: 220px; accent-color: #e8be78; }
    button { font: inherit; padding: 10px 18px; border: 1px solid #98b8bf; border-radius: 6px; background: #244858; color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #e8be78; outline-offset: 4px; }
    p { line-height: 1.5; color: #bad0d5; }
    output { font-variant-numeric: tabular-nums; }
    #stats { display: block; margin-top: 16px; }
  </style>
</head>
<body>
  <canvas aria-label="Animated flat-shaded Gerstner ocean with a surface sampling buoy"></canvas>
  <main>
    <h1>The Crossing · Ocean sandbox</h1>
    <div class="controls">
      <label>Storm <output id="stormValue">0.50</output><input id="storm" type="range" min="0" max="1" step="0.01" value="0.5"></label>
      <label>Wind <output id="windValue">12 m/s</output><input id="wind" type="range" min="0" max="26" step="0.5" value="12"></label>
      <button id="pause" type="button" aria-pressed="false">Pause</button>
      <button id="reset" type="button">Reset sea</button>
    </div>
    <output id="stats"></output>
    <p>Storm changes settle over ten seconds. The gold buoy samples the displaced surface. Wind controls whitecap coverage. This sandbox exercises the ocean module for Part A.</p>
  </main>
  <script type="module">
    import { createOcean } from '../src/sea/index.js';

    const canvas = document.querySelector('canvas');
    const context = canvas.getContext('2d');
    const storm = document.querySelector('#storm');
    const wind = document.querySelector('#wind');
    const stats = document.querySelector('#stats');
    const pause = document.querySelector('#pause');
    const env = { storm: 0.5, windSpeed: 12, windHeading: 0.6 };
    function makeOcean() {
      let seed = 42;
      return createOcean(env, () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 2 ** 32));
    }
    let ocean = makeOcean();
    let paused = false;
    let width = 0, height = 0;
    const count = 48;
    const points = Array.from({ length: (count + 1) ** 2 }, () => ({ x: 0, y: 0, elevation: 0 }));
    const sample = { normal: {}, velocity: {} };
    const buoy = { x: 0, y: 0 };
    function resize() {
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      const ratio = Math.min(devicePixelRatio, 2);
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();
    storm.addEventListener('input', () => {
      env.storm = Number(storm.value);
      document.querySelector('#stormValue').value = env.storm.toFixed(2);
    });
    wind.addEventListener('input', () => {
      env.windSpeed = Number(wind.value);
      document.querySelector('#windValue').value = `${env.windSpeed} m/s`;
    });
    pause.addEventListener('click', () => {
      paused = !paused;
      pause.textContent = paused ? 'Resume' : 'Pause';
      pause.setAttribute('aria-pressed', String(paused));
    });
    document.querySelector('#reset').addEventListener('click', () => { ocean = makeOcean(); });
    function project(x, y, z, out) {
      const scale = Math.min(width, height * 2) / (z + 100);
      out.x = width / 2 + x * scale;
      out.y = height * 0.15 + (32 - y - z * 0.16) * scale;
    }
    function triangle(a, b, c) {
      const shade = Math.max(0, Math.min(1, 0.5 + (a.elevation + b.elevation + c.elevation) * 0.25));
      const foam = shade > 0.7 ? ocean.whitecaps * (shade - 0.7) / 0.3 : 0;
      context.fillStyle = `rgb(${22 + shade * 25 + foam * 125} ${65 + shade * 50 + foam * 100} ${82 + shade * 48 + foam * 95})`;
      context.beginPath();
      context.moveTo(a.x, a.y); context.lineTo(b.x, b.y); context.lineTo(c.x, c.y);
      context.closePath(); context.fill();
    }
    let previous = performance.now();
    let reportTime = 0;
    function frame(now) {
      const dt = Math.min((now - previous) / 1000, 0.05);
      previous = now;
      if (!paused && !document.hidden) ocean.update(dt);
      context.fillStyle = '#102b3b'; context.fillRect(0, 0, width, height);
      const started = performance.now();
      for (let row = 0; row <= count; row++) {
        for (let col = 0; col <= count; col++) {
          const x = (col / count - 0.5) * 150;
          const z = row / count * 150 - 35;
          const point = points[row * (count + 1) + col];
          point.elevation = ocean.height(x, z);
          project(x, point.elevation, z, point);
        }
      }
      const sampleTime = performance.now() - started;
      for (let row = count - 1; row >= 0; row--) {
        for (let col = 0; col < count; col++) {
          const i = row * (count + 1) + col;
          triangle(points[i], points[i + 1], points[i + count + 1]);
          triangle(points[i + 1], points[i + count + 2], points[i + count + 1]);
        }
      }
      ocean.sample(0, 0, sample);
      project(0, sample.height, 0, buoy);
      context.strokeStyle = '#e8be78'; context.lineWidth = 3;
      context.beginPath(); context.moveTo(buoy.x, buoy.y); context.lineTo(buoy.x + sample.normal.x * 25, buoy.y - sample.normal.y * 25); context.stroke();
      context.fillStyle = '#e8be78'; context.beginPath(); context.arc(buoy.x, buoy.y, 6, 0, Math.PI * 2); context.fill();
      if (now - reportTime > 250) {
        stats.value = `Wave height ${ocean.significantHeight.toFixed(2)} m · Whitecaps ${Math.round(ocean.whitecaps * 100)}% · Time ${ocean.time.toFixed(1)} s · 2,401 CPU samples ${sampleTime.toFixed(1)} ms`;
        reportTime = now;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
